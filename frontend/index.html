<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/cargo-core-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Cargo-Core</title>
  <meta name="description" content="Moving What Matters" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    }
  </script>

</head>

<body
  class="m-0 p-0 overflow-x-hidden overscroll-none bg-background-light dark:bg-background-dark text-gray-900 dark:text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
