version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - logistics_net
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    container_name: logistics_dbw
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics_pass}
      POSTGRES_DB: ${POSTGRES_DB:-logistics_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - logistics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics_user} -d ${POSTGRES_DB:-logistics_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: logistics_redis
    ports:
      - "6379:6379"
    networks:
      - logistics_net

volumes:
  pgdata:

networks:
  logistics_net:
    driver: bridge
