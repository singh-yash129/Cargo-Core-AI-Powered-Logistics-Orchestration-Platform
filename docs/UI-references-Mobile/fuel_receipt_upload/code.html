<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fuel Receipt Upload</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112119",
                        "surface-dark": "#1A2E24", 
                        "surface-highlight": "#233B2F"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* iOS Safe Area spacing */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary selection:text-background-dark">
<!-- Header -->
<header class="sticky top-0 z-50 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-gray-200 dark:border-white/10">
<div class="px-4 h-14 flex items-center justify-between">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">
<span class="material-icons text-gray-600 dark:text-gray-300">close</span>
</button>
<h1 class="text-lg font-semibold tracking-tight">Fuel Receipt</h1>
<div class="w-10"></div> <!-- Spacer for visual balance -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 py-6 flex flex-col gap-6 max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex items-center gap-2 mb-2">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-gray-200 dark:bg-white/10 rounded-full"></div>
</div>
<!-- Step 1: Vehicle Details -->
<section class="animate-fade-in-up">
<div class="flex items-center gap-3 mb-3">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-background-dark font-bold text-xs">1</div>
<h2 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Vehicle Details</h2>
</div>
<div class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-gray-100 dark:border-white/5 overflow-hidden">
<!-- Total Amount Input -->
<div class="p-5 border-b border-gray-100 dark:border-white/5">
<label class="block text-xs font-medium text-primary mb-2 uppercase tracking-wide" for="amount">Total Amount</label>
<div class="relative flex items-center">
<span class="absolute left-0 text-2xl font-medium text-gray-400 dark:text-gray-500">$</span>
<input class="block w-full pl-6 pr-0 py-0 text-3xl font-semibold bg-transparent border-0 border-b-0 focus:ring-0 placeholder-gray-300 dark:placeholder-gray-600 text-gray-900 dark:text-white" id="amount" inputmode="decimal" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Odometer Input -->
<div class="p-5">
<label class="block text-xs font-medium text-primary mb-2 uppercase tracking-wide" for="odometer">Current Odometer</label>
<div class="relative flex items-center justify-between">
<input class="block w-full pr-12 pl-0 py-0 text-3xl font-semibold bg-transparent border-0 border-b-0 focus:ring-0 placeholder-gray-300 dark:placeholder-gray-600 text-gray-900 dark:text-white tracking-widest" id="odometer" inputmode="numeric" placeholder="000000" type="number"/>
<span class="text-sm font-medium text-gray-400 dark:text-gray-500 uppercase">mi</span>
</div>
</div>
</div>
<p class="mt-2 text-xs text-gray-500 dark:text-gray-400 pl-2">Last recorded: 45,230 mi</p>
</section>
<!-- Step 2: Receipt Capture -->
<section class="animate-fade-in-up" style="animation-delay: 100ms;">
<div class="flex items-center gap-3 mb-3">
<div class="w-6 h-6 rounded-full bg-gray-200 dark:bg-white/10 text-gray-500 dark:text-gray-400 flex items-center justify-center font-bold text-xs">2</div>
<h2 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Receipt Photo</h2>
</div>
<!-- Empty State / Capture Area -->
<button class="w-full group relative bg-white dark:bg-surface-dark rounded-xl border-2 border-dashed border-gray-300 dark:border-white/20 hover:border-primary dark:hover:border-primary transition-all duration-300 p-8 flex flex-col items-center justify-center gap-4 text-center h-48">
<div class="w-14 h-14 rounded-full bg-primary/10 group-hover:bg-primary/20 flex items-center justify-center transition-colors">
<span class="material-icons text-3xl text-primary">add_a_photo</span>
</div>
<div>
<h3 class="font-medium text-gray-900 dark:text-white">Tap to scan receipt</h3>
<p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Make sure items and total are clear</p>
</div>
</button>
</section>
<!-- Recent Locations (Optional Context) -->
<section class="mt-2 animate-fade-in-up" style="animation-delay: 200ms;">
<h3 class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3 pl-2">Location</h3>
<div class="bg-white dark:bg-surface-dark rounded-xl p-4 flex items-center gap-4 border border-gray-100 dark:border-white/5">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
<span class="material-icons text-primary text-sm">local_gas_station</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-sm font-medium text-gray-900 dark:text-white truncate">Shell Station #4920</p>
<p class="text-xs text-gray-500 dark:text-gray-400 truncate">1200 Logistics Way, Atlanta GA</p>
</div>
<span class="material-icons text-gray-400 text-lg">edit</span>
</div>
</section>
</main>
<!-- Footer Actions -->
<footer class="sticky bottom-0 z-50 p-4 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-white/5 safe-bottom">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-semibold py-4 px-6 rounded-xl shadow-lg shadow-primary/20 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Submit Receipt</span>
<span class="material-icons text-lg">arrow_forward</span>
</button>
</div>
</footer>
<!-- Background Elements for visual interest (subtle) -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] bg-primary/5 blur-[100px] rounded-full"></div>
<div class="absolute top-[40%] -left-[10%] w-[40%] h-[40%] bg-primary/5 blur-[80px] rounded-full"></div>
</div>
</body></html>
