<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Command Center</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112119",
                        "surface-dark": "#1a2c24", // Slightly lighter than bg-dark for cards
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom pulsing animation for the GPS dot */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); }
            80%, 100% { opacity: 0; }
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.8); }
            50% { transform: scale(1); }
            100% { transform: scale(0.8); }
        }
        .gps-ring {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .gps-dot {
            animation: pulse-dot 1.25s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
        }
        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-white h-screen overflow-hidden flex flex-col antialiased selection:bg-primary selection:text-black">
<!-- Status Bar & Header -->
<header class="pt-12 px-6 pb-4 flex justify-between items-center z-10">
<div class="flex flex-col">
<h1 class="text-4xl font-light tracking-tight text-white">08:45<span class="text-lg text-gray-400 ml-1 font-normal">AM</span></h1>
<p class="text-sm text-gray-400 mt-1 uppercase tracking-wider font-medium">Wed, Oct 24</p>
</div>
<div class="flex items-center gap-2 bg-surface-dark/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/5">
<div class="relative flex items-center justify-center w-3 h-3">
<span class="gps-ring absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="gps-dot relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</div>
<span class="text-xs font-semibold text-primary tracking-wide">GPS ACTIVE</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-6 flex flex-col justify-center relative z-0">
<!-- Background Map Graphic (Subtle) -->
<div class="absolute inset-0 z-[-1] opacity-20 pointer-events-none overflow-hidden">
<!-- Using a gradient to simulate a map fade effect at the bottom -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/80 to-transparent"></div>
<!-- Simulated Map Lines using CSS gradients -->
<div class="w-full h-full" style="background-image: radial-gradient(circle at 50% 50%, #44e996 1px, transparent 1px); background-size: 40px 40px; opacity: 0.1;"></div>
</div>
<!-- Today's Route Summary Card -->
<div class="bg-surface-dark/40 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-2xl relative overflow-hidden group">
<!-- Decorative Glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl group-hover:bg-primary/20 transition-colors duration-500"></div>
<div class="flex justify-between items-start mb-8 relative">
<div>
<h2 class="text-gray-400 text-sm font-medium uppercase tracking-widest mb-1">Today's Manifest</h2>
<div class="text-2xl font-semibold text-white">Route #892-B</div>
</div>
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-icons text-primary">local_shipping</span>
</div>
</div>
<!-- Metrics Grid -->
<div class="grid grid-cols-2 gap-4 mb-2">
<!-- Stops -->
<div class="bg-black/20 rounded-2xl p-4 border border-white/5 hover:border-primary/30 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="text-gray-400 text-xs uppercase font-medium">Stops</span>
<span class="material-icons text-gray-500 text-sm">place</span>
</div>
<div class="text-3xl font-bold text-white">12</div>
<div class="text-xs text-primary mt-1">On Schedule</div>
</div>
<!-- Est Time -->
<div class="bg-black/20 rounded-2xl p-4 border border-white/5 hover:border-primary/30 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="text-gray-400 text-xs uppercase font-medium">Est. Duration</span>
<span class="material-icons text-gray-500 text-sm">schedule</span>
</div>
<div class="text-3xl font-bold text-white">4<span class="text-lg font-medium text-gray-500">h</span> 20<span class="text-lg font-medium text-gray-500">m</span></div>
<div class="text-xs text-gray-400 mt-1">Ends at 1:05 PM</div>
</div>
<!-- Distance -->
<div class="bg-black/20 rounded-2xl p-4 border border-white/5 hover:border-primary/30 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="text-gray-400 text-xs uppercase font-medium">Distance</span>
<span class="material-icons text-gray-500 text-sm">timeline</span>
</div>
<div class="text-3xl font-bold text-white">45</div>
<div class="text-xs text-gray-400 mt-1">Miles Total</div>
</div>
<!-- Crew -->
<div class="bg-black/20 rounded-2xl p-4 border border-white/5 hover:border-primary/30 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="text-gray-400 text-xs uppercase font-medium">Crew</span>
<span class="material-icons text-gray-500 text-sm">group</span>
</div>
<div class="flex items-center gap-2 mt-1">
<div class="flex -space-x-3 overflow-hidden">
<img alt="Crew member face portrait" class="inline-block h-8 w-8 rounded-full ring-2 ring-surface-dark object-cover" data-alt="Male crew member portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFbLXefTYh6suhPOOBcTOZBLkliNKdGY7ooTVEYOBweO44Ipj4Bceag4rDvC3Kr1v_7Zn8nII-Mbqjq8DVNKjqAWos_NxSfD4k0Vbc1CE2Pwzn3JDRJmUm9E98L8paIhjQdq7z-JZqc8N3KcNy544ozUOcShsoIjeJeM2_chTDbNvgsJEm04OotX0vO76mhm0wuDm1jFRhb9hq4UTJewqDZn2dTov2zbLSt6AzQco_1nqn-uDfKS1pUYX9h_FmIWycSXoMpuHc2Hc"/>
<img alt="Crew member face portrait" class="inline-block h-8 w-8 rounded-full ring-2 ring-surface-dark object-cover" data-alt="Female crew member portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIrwKHw0F5aEwRbYE9kZ3s6-E39omJrGGWh71WK1QMlXmvZtCmT4H8HoNCzm7bguaiAgASolTiAZrwiwaIMjsELcVh92tAPCZd9bm_4edjLJsJr8sDXMpkMiTYFk0j7dtiyM5Y_Hdr7RFOc8fNjsEZlwOLCw3W89S-McWDG9qDEUFN972iABLvDh4yhc7F1mE1quoVGW-jQomR2QIXr1ICk3GZ7BDXBK5Q3HK-Ge1jgihwzWrfqwesDUR4ie1zg6Gi_9mwrK71w-w"/>
</div>
<span class="text-white font-bold text-lg">+1</span>
</div>
<div class="text-xs text-gray-400 mt-2">Loaders Assigned</div>
</div>
</div>
<!-- Mini map preview -->
<div class="mt-4 h-24 w-full rounded-xl overflow-hidden relative border border-white/5">
<img alt="Map view of route" class="w-full h-full object-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-500" data-alt="Top down dark map view of city streets" data-location="Los Angeles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpkakTL7Rxpd_ZW8l0pe5k2oaHIUedk8O2V75Mfoc8_0_0m_82fYkDIVgBnVgmBQATqbZPV5TMgVlBMHP8GpRMRROvCGCseBWSdQDjGV3QCERDcYRTgHay_3PFHJgo7CIuF6JLA4OmQHnOurWRgXPAdnQLVElafW8bzxYLU5fkvLtzGSUwLoGPhvHQTn71KASB_UaKTv3wqJ6JGOZ2tDdk8ox2TqPPJXo-yj7_bQf8b5GJjnVIsREFBHFzeokP8gfxzxdcDDYMuIo"/>
<div class="absolute inset-0 bg-gradient-to-r from-background-dark/80 to-transparent flex items-center pl-4">
<span class="text-xs font-medium text-white bg-black/50 px-2 py-1 rounded backdrop-blur-sm">Map Preview</span>
</div>
</div>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Primary Action -->
<div class="mb-8">
<button class="group relative w-full overflow-hidden rounded-2xl bg-surface-dark p-1 shadow-lg active:scale-[0.98] transition-transform duration-200">
<div class="absolute inset-0 bg-gradient-to-r from-primary/80 to-primary opacity-100 transition-opacity"></div>
<!-- Shine effect -->
<div class="absolute top-0 -left-[100%] h-full w-full skew-x-[-20deg] bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shine_1s_ease-in-out_infinite]" style="animation: shine 2s infinite;"></div>
<div class="relative flex h-16 items-center justify-center rounded-xl bg-transparent">
<span class="mr-3 material-icons text-background-dark text-3xl animate-pulse">play_arrow</span>
<span class="text-xl font-bold uppercase tracking-wider text-background-dark">Begin Route</span>
</div>
</button>
<p class="text-center text-xs text-gray-500 mt-3 font-medium">Press and hold to start navigation</p>
</div>
</main>
<!-- Bottom Dock / Quick Actions -->
<nav class="pb-8 px-6">
<div class="flex justify-between items-center bg-surface-dark/80 backdrop-blur-lg rounded-2xl p-2 border border-white/5 shadow-2xl">
<!-- Wallet -->
<button class="flex-1 flex flex-col items-center justify-center py-2 gap-1 group">
<div class="bg-transparent p-2 rounded-xl group-hover:bg-white/5 transition-colors">
<span class="material-icons text-gray-400 group-hover:text-primary transition-colors text-2xl">account_balance_wallet</span>
</div>
<span class="text-[10px] font-medium text-gray-500 group-hover:text-gray-300">Wallet</span>
</button>
<!-- Support -->
<button class="flex-1 flex flex-col items-center justify-center py-2 gap-1 group">
<div class="bg-transparent p-2 rounded-xl group-hover:bg-white/5 transition-colors">
<span class="material-icons text-gray-400 group-hover:text-primary transition-colors text-2xl">headset_mic</span>
</div>
<span class="text-[10px] font-medium text-gray-500 group-hover:text-gray-300">Support</span>
</button>
<!-- Reports -->
<button class="flex-1 flex flex-col items-center justify-center py-2 gap-1 group">
<div class="bg-transparent p-2 rounded-xl group-hover:bg-white/5 transition-colors">
<span class="material-icons text-gray-400 group-hover:text-primary transition-colors text-2xl">bar_chart</span>
</div>
<span class="text-[10px] font-medium text-gray-500 group-hover:text-gray-300">Reports</span>
</button>
<!-- Vehicle -->
<button class="flex-1 flex flex-col items-center justify-center py-2 gap-1 group relative">
<div class="bg-transparent p-2 rounded-xl group-hover:bg-white/5 transition-colors">
<span class="material-icons text-gray-400 group-hover:text-primary transition-colors text-2xl">directions_car</span>
</div>
<span class="text-[10px] font-medium text-gray-500 group-hover:text-gray-300">Vehicle</span>
<!-- Notification Dot -->
<span class="absolute top-2 right-4 h-2 w-2 rounded-full bg-red-500 border border-surface-dark"></span>
</button>
</div>
</nav>
<!-- CSS for shine animation -->
<style>
        @keyframes shine {
            0% { transform: translateX(0); }
            100% { transform: translateX(200%); }
        }
    </style>
</body></html>
