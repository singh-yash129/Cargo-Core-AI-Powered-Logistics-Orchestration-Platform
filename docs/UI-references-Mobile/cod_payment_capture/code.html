<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>COD Payment Capture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112119",
                        // Neutrals derived from primary hue (approx 150deg)
                        "neutral-800": "#1a2e24", 
                        "neutral-700": "#253d31",
                        "neutral-600": "#4a6358",
                        "neutral-500": "#789185",
                        "neutral-400": "#a8bdbc",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom Keypad Styles */
        .keypad-btn {
            @apply active:scale-95 transition-transform duration-150 flex items-center justify-center text-2xl font-medium text-white h-16 w-full rounded-lg hover:bg-neutral-800 active:bg-neutral-700;
        }
        /* Ripple effect logic - simplified with CSS animation */
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(68, 233, 150, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(68, 233, 150, 0); }
            100% { box-shadow: 0 0 0 0 rgba(68, 233, 150, 0); }
        }
        .ripple-active:active {
            animation: ripple 0.6s linear;
        }
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary selection:text-background-dark overflow-hidden relative">
<!-- Status Bar Area (Mock) -->
<div class="h-12 w-full flex justify-between items-center px-6 pt-2 z-20">
<span class="text-xs font-semibold">9:41</span>
<div class="flex gap-1.5">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm">battery_full</span>
</div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 z-10">
<button class="text-neutral-500 hover:text-white transition-colors text-sm font-medium">Cancel</button>
<div class="flex flex-col items-center">
<h1 class="text-sm font-semibold tracking-wide text-neutral-400">ORDER #99281-A</h1>
<div class="flex items-center gap-1 mt-0.5">
<div class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse"></div>
<span class="text-xs text-yellow-500 font-medium">Payment Pending</span>
</div>
</div>
<button class="text-neutral-500 hover:text-white transition-colors">
<span class="material-icons-round">help_outline</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-6 pb-6 relative z-10">
<!-- Total Due Card -->
<div class="bg-neutral-800 rounded-xl p-6 mb-6 shadow-lg border border-neutral-700/50 flex flex-col items-center justify-center relative overflow-hidden group">
<!-- Subtle background pattern -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-50"></div>
<p class="text-neutral-400 text-sm uppercase tracking-wider font-medium mb-1 relative z-10">Total Amount Due</p>
<div class="flex items-baseline relative z-10">
<span class="text-2xl text-neutral-400 mr-1 font-light">$</span>
<span class="text-5xl font-bold text-white tracking-tight">125.50</span>
</div>
<!-- Customer Info Mini -->
<div class="mt-4 flex items-center gap-2 bg-neutral-900/50 px-3 py-1.5 rounded-lg border border-neutral-700/50">
<img class="w-6 h-6 rounded-full object-cover border border-neutral-600" data-alt="Customer profile portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArlRW1xl1Ky_EJ5sTQ2DbzP_32bpWQ9_dVrUtiZahupvV_qIPk2uoforrQ3FMdfiWQL4iyqyHSfI2G5iC5i8KDDGrVcQPRrNovuq5wah-h6C3zZ1yhR_5_DUxojm4cM_VUMh8LPvwk6pcgzBhPFCI3R6YJxztiwN5P2s-wdhRUneuZmYQMPW1GEEeEunv5iarkesc6Oe8MtqVzAgb29K7Oz0kvNQUPbKWU0NxHBPbkFyepto7CIAY98RF4J_o9LgGj4cWnCPAsFn8"/>
<span class="text-xs text-neutral-300">Sophia M. • 2 Items</span>
</div>
</div>
<!-- Input Section -->
<div class="flex flex-col flex-1">
<!-- Large Input Display -->
<div class="flex flex-col items-center justify-center mb-6">
<label class="text-neutral-500 text-xs mb-2" for="amount">CASH COLLECTED</label>
<div class="relative w-full">
<input class="w-full bg-transparent text-center text-4xl font-semibold text-primary border-b-2 border-primary/30 focus:border-primary focus:ring-0 px-4 py-2 placeholder-neutral-700 transition-colors" id="amount" placeholder="0.00" type="text" value="125.50"/>
<span class="absolute left-[25%] top-1/2 -translate-y-1/2 text-2xl text-primary/50">$</span>
</div>
<!-- Dynamic Difference Indicator -->
<div class="mt-3 flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/20">
<span class="material-icons-round text-primary text-sm">check_circle</span>
<span class="text-xs font-medium text-primary">Exact Amount</span>
</div>
</div>
<!-- Quick Action Grid -->
<div class="grid grid-cols-2 gap-4 mb-6">
<button class="flex flex-col items-center justify-center gap-2 bg-neutral-800 hover:bg-neutral-700 active:scale-95 transition-all p-4 rounded-xl border border-neutral-700/50 group">
<div class="w-10 h-10 rounded-full bg-neutral-700 group-hover:bg-neutral-600 flex items-center justify-center text-white">
<span class="material-icons-round">qr_code_scanner</span>
</div>
<span class="text-sm font-medium text-white">Scan QR</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 bg-neutral-800 hover:bg-neutral-700 active:scale-95 transition-all p-4 rounded-xl border border-neutral-700/50 group">
<div class="w-10 h-10 rounded-full bg-neutral-700 group-hover:bg-neutral-600 flex items-center justify-center text-primary">
<span class="material-icons-round">payments</span>
</div>
<span class="text-sm font-medium text-white">Full Amount</span>
</button>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-2 mb-4 mt-auto">
<button class="keypad-btn">1</button>
<button class="keypad-btn">2</button>
<button class="keypad-btn">3</button>
<button class="keypad-btn">4</button>
<button class="keypad-btn">5</button>
<button class="keypad-btn">6</button>
<button class="keypad-btn">7</button>
<button class="keypad-btn">8</button>
<button class="keypad-btn">9</button>
<button class="keypad-btn text-xl">.</button>
<button class="keypad-btn">0</button>
<button class="keypad-btn text-neutral-400">
<span class="material-icons-round">backspace</span>
</button>
</div>
</div>
</main>
<!-- Sticky Bottom Action -->
<div class="sticky bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark to-transparent z-50">
<button class="w-full bg-primary hover:bg-green-400 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transform transition-all active:scale-[0.98] ripple-active">
<span>Confirm Payment</span>
<span class="material-icons-round text-xl">arrow_forward</span>
</button>
</div>
<!-- Decorative Background Blob -->
<div class="fixed top-[-10%] right-[-20%] w-[300px] h-[300px] bg-primary/10 blur-[100px] rounded-full pointer-events-none z-0"></div>
<div class="fixed bottom-[10%] left-[-10%] w-[200px] h-[200px] bg-blue-500/5 blur-[80px] rounded-full pointer-events-none z-0"></div>
</body></html>
