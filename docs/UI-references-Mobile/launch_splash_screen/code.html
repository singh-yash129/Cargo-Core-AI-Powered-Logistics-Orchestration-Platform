<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Launch Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#0F1115", // Deep matte charcoal as requested
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 20px -5px rgba(68, 233, 150, 0.3)' },
                            '100%': { boxShadow: '0 0 50px 10px rgba(68, 233, 150, 0.15)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        /* Custom utilities for the specific glow effect */
        .neon-glow {
            filter: drop-shadow(0 0 15px rgba(68, 233, 150, 0.4));
        }
        .bg-gradient-radial {
            background-image: radial-gradient(circle at center, var(--tw-gradient-stops));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display h-screen w-screen overflow-hidden flex flex-col justify-between items-center relative selection:bg-primary selection:text-background-dark">
<!-- Status Bar Area (Visual placeholder for iOS) -->
<div class="w-full h-12 flex justify-between items-center px-6 pt-2 z-50 absolute top-0 text-white/40 text-xs font-medium">
<span>9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-[14px]">signal_cellular_alt</span>
<span class="material-icons text-[14px]">wifi</span>
<span class="material-icons text-[14px] rotate-90">battery_full</span>
</div>
</div>
<!-- Background Ambient Glow -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center overflow-hidden">
<div class="w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] opacity-40"></div>
</div>
<!-- Main Content: Centered Logo -->
<div class="flex-1 flex flex-col items-center justify-center z-10 w-full relative">
<!-- Logo Container -->
<div class="relative group">
<!-- Animated Glow Behind -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl animate-pulse-slow"></div>
<!-- Logo Mark -->
<div class="relative w-24 h-24 md:w-32 md:h-32 flex items-center justify-center">
<!-- Abstract Geometric Logo -->
<svg class="w-full h-full text-primary neon-glow" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Outer Ring Segment -->
<path d="M50 10 A40 40 0 0 1 90 50" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
<path class="opacity-30" d="M90 50 A40 40 0 0 1 50 90" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
<path d="M50 90 A40 40 0 0 1 10 50" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
<path class="opacity-30" d="M10 50 A40 40 0 0 1 50 10" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
<!-- Inner Geometric Core -->
<path class="drop-shadow-lg" d="M50 30 L67 60 H33 L50 30 Z" fill="rgba(68, 233, 150, 0.1)" stroke="currentColor" stroke-linejoin="round" stroke-width="3"></path>
<circle cx="50" cy="45" fill="currentColor" r="2"></circle>
</svg>
</div>
</div>
<!-- App Name (Optional hidden, keeping it super minimal as per prompt, just the mark is often enough for 'Tesla-like' feel, but adding subtle branding below) -->
<div class="mt-8 opacity-0 animate-[fadeIn_1s_ease-out_forwards_0.5s]">
<!-- Keeping the center clean -->
</div>
</div>
<!-- Footer: System Text & Loading -->
<div class="z-10 pb-12 flex flex-col items-center gap-6 w-full px-8">
<!-- Minimal Loading Bar -->
<div class="w-16 h-0.5 bg-white/10 rounded-full overflow-hidden relative">
<div class="absolute inset-y-0 left-0 bg-primary w-1/2 animate-[slideRight_1.5s_ease-in-out_infinite]"></div>
</div>
<!-- Footer Text -->
<div class="text-center">
<h1 class="text-xs tracking-[0.3em] font-medium text-white/50 uppercase font-display">
                Field Execution System
            </h1>
<p class="text-[10px] tracking-widest text-primary/40 mt-1 uppercase opacity-60">
                v4.2.0 • Pro Driver
            </p>
</div>
</div>
<!-- Animation Keyframes needed for the inline styles -->
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
    </style>
</body></html>
