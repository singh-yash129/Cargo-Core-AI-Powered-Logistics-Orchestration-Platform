<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Voice Assistant Overlay - Logistics App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#258cf4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wave': 'wave 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        wave: {
                            '0%, 100%': { height: '10%' },
                            '50%': { height: '60%' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Simulating the wave animation with varying delays */
        .wave-bar {
            animation: wave 1s ease-in-out infinite;
        }
        .wave-bar:nth-child(odd) {
            animation-duration: 0.8s;
        }
        .wave-bar:nth-child(2n) {
            animation-duration: 1.1s;
        }
        .wave-bar:nth-child(3n) {
            animation-duration: 1.3s;
        }
        .wave-bar:nth-child(4n) {
            animation-duration: 0.9s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white font-display h-screen w-screen overflow-hidden relative">
<!-- 
        BACKGROUND LAYER: Represents the "Current Screen" (Logistics Map/Manifest) 
        This is blurred out by the overlay but provides context.
    -->
<div class="absolute inset-0 z-0 flex flex-col h-full w-full bg-background-dark">
<!-- Header -->
<header class="pt-12 pb-4 px-6 flex justify-between items-center bg-[#1a2632] border-b border-gray-800">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center">
<span class="material-icons text-white">menu</span>
</div>
<div>
<h1 class="text-sm text-gray-400 font-medium">Current Route</h1>
<p class="text-lg font-bold text-white">Route #8294-B</p>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-icons text-white">navigation</span>
</div>
</header>
<!-- Map Area (Simulated) -->
<div class="flex-1 relative w-full bg-[#151f2b]">
<!-- Map Image Placeholder -->
<img alt="Dark themed street map of a city route" class="w-full h-full object-cover opacity-60 grayscale-[30%]" data-alt="Dark themed street map of a city route" data-location="Seattle" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpdTmsK_hq-j3QtbxXHwfAMJwpjU94QdQjmsddrgddvXAUfZgVsR1xZk0dyNCJmGqdKyc2cg9BeZ9cH1P1PdfTp0GWRy4WNWE6qUTRuYDj_NyfXAqpuwKTeOFmnYEZR1XBPFE0uR9yz20YO_jfQ6Xuzy4oV02jfXcWl_zQ5A8ZIq-b01ecIWI6W2-LJhKRJlaaaQCH2imWqpezxy14y2uw5SvED6YwpzD0WcXUUhbj8rfXYRE-rnDVnJVqdnRw-bSudMKYh7K4fPQ"/>
<!-- Floating Logistics Card on "Background" -->
<div class="absolute bottom-8 left-4 right-4 bg-[#1e2a36] p-5 rounded-xl border border-gray-700 shadow-xl">
<div class="flex justify-between items-start mb-3">
<div>
<span class="text-xs font-bold text-primary bg-primary/20 px-2 py-1 rounded mb-2 inline-block">NEXT STOP</span>
<h3 class="text-xl font-bold text-white">402 Pine Street</h3>
<p class="text-gray-400 text-sm">Target Delivery: 10:45 AM</p>
</div>
<div class="bg-gray-700 p-2 rounded-lg">
<span class="material-icons text-white">local_shipping</span>
</div>
</div>
<div class="w-full bg-gray-700 h-1 rounded-full overflow-hidden">
<div class="bg-primary w-3/4 h-full rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- 
        OVERLAY LAYER: The AI Voice Assistant Interface 
        Uses backdrop-blur and semi-transparent dark background.
    -->
<div class="absolute inset-0 z-50 flex flex-col justify-end backdrop-blur-md bg-background-dark/85 transition-opacity duration-300">
<!-- Close Button (Top Right Safe Area) -->
<button class="absolute top-14 right-6 w-10 h-10 rounded-full bg-white/10 border border-white/10 flex items-center justify-center hover:bg-white/20 transition-colors active:scale-95">
<span class="material-icons text-white/70 text-xl">close</span>
</button>
<!-- Main Content Area -->
<div class="w-full px-6 pb-12 pt-20 flex flex-col items-center justify-end h-full max-w-md mx-auto relative">
<!-- Conversation History / Prompt Area -->
<div class="flex-1 w-full flex flex-col justify-center items-center mb-8 space-y-8">
<!-- Status Icon -->
<div class="relative">
<div class="absolute inset-0 bg-primary/30 rounded-full blur-xl animate-pulse-slow"></div>
<div class="w-16 h-16 rounded-full bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center shadow-[0_0_30px_rgba(37,140,244,0.4)] border border-primary/50 relative z-10">
<span class="material-icons text-white text-3xl animate-pulse">mic</span>
</div>
</div>
<!-- Main Status Text -->
<div class="text-center space-y-2">
<h2 class="text-3xl font-bold text-white tracking-tight drop-shadow-lg">Listening...</h2>
<p class="text-primary/80 font-medium text-sm tracking-wide uppercase">AI Assistant Active</p>
</div>
</div>
<!-- Suggestions / Hints -->
<div class="w-full mb-12">
<div class="flex flex-col items-center space-y-3">
<p class="text-gray-400 text-sm font-medium">Try saying:</p>
<button class="w-full bg-white/5 border border-white/10 hover:bg-white/10 active:bg-white/15 backdrop-blur-sm px-5 py-4 rounded-xl flex items-center justify-between group transition-all">
<span class="text-gray-200 font-medium text-lg">"Read next stop details"</span>
<span class="material-icons text-primary opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 transform duration-300">arrow_forward</span>
</button>
<button class="w-full bg-white/5 border border-white/10 hover:bg-white/10 active:bg-white/15 backdrop-blur-sm px-5 py-4 rounded-xl flex items-center justify-between group transition-all">
<span class="text-gray-200 font-medium text-lg">"Navigate to warehouse"</span>
<span class="material-icons text-primary opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 transform duration-300">arrow_forward</span>
</button>
</div>
</div>
<!-- Waveform Visualizer -->
<div class="w-full h-24 flex items-end justify-center gap-1.5 mb-8 px-8">
<!-- Generative bars for waveform -->
<div class="w-1.5 bg-primary/40 rounded-full wave-bar h-8"></div>
<div class="w-1.5 bg-primary/60 rounded-full wave-bar h-12"></div>
<div class="w-1.5 bg-primary/80 rounded-full wave-bar h-16"></div>
<div class="w-1.5 bg-primary rounded-full wave-bar h-24 shadow-[0_0_15px_#258cf4]"></div>
<div class="w-1.5 bg-white rounded-full wave-bar h-14 shadow-[0_0_20px_#ffffff]"></div>
<div class="w-1.5 bg-primary rounded-full wave-bar h-20 shadow-[0_0_15px_#258cf4]"></div>
<div class="w-1.5 bg-primary/80 rounded-full wave-bar h-10"></div>
<div class="w-1.5 bg-primary/60 rounded-full wave-bar h-6"></div>
<div class="w-1.5 bg-primary/40 rounded-full wave-bar h-8"></div>
<div class="w-1.5 bg-primary/30 rounded-full wave-bar h-4"></div>
<!-- Mirroring bars for symmetry feel -->
<div class="w-1.5 bg-primary/40 rounded-full wave-bar h-12"></div>
<div class="w-1.5 bg-primary/60 rounded-full wave-bar h-16"></div>
<div class="w-1.5 bg-primary rounded-full wave-bar h-10"></div>
<div class="w-1.5 bg-white rounded-full wave-bar h-6 shadow-[0_0_10px_#ffffff]"></div>
<div class="w-1.5 bg-primary rounded-full wave-bar h-14 shadow-[0_0_15px_#258cf4]"></div>
<div class="w-1.5 bg-primary/80 rounded-full wave-bar h-8"></div>
<div class="w-1.5 bg-primary/50 rounded-full wave-bar h-4"></div>
</div>
<!-- Bottom Cancel Action -->
<button class="mb-4 text-gray-400 hover:text-white text-sm font-medium tracking-wide transition-colors flex items-center gap-2 px-6 py-3 rounded-full hover:bg-white/5">
<span class="material-icons text-base">stop_circle</span>
                Tap to cancel
            </button>
<!-- Home Indicator Safe Area -->
<div class="w-1/3 h-1.5 bg-white/20 rounded-full mt-2"></div>
</div>
</div>
</body></html>
