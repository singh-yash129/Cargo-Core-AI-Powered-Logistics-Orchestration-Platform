<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Login Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112119",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1rem", // approximating 16px
                        "full": "9999px"
                    },
                    backgroundImage: {
                        'glass-gradient': 'linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%)',
                    }
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Custom utilities for glassmorphism */
        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus-within {
            border-color: #44e996;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 1px rgba(68, 233, 150, 0.1);
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(68, 233, 150, 0.15) 0%, rgba(17, 33, 25, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-white font-display min-h-screen flex items-center justify-center p-4 selection:bg-primary selection:text-background-dark overflow-hidden relative">
<!-- Ambient Background Effects -->
<div class="ambient-glow top-[-100px] left-[-50px]"></div>
<div class="ambient-glow bottom-[-50px] right-[-100px]" style="background: radial-gradient(circle, rgba(68, 233, 150, 0.08) 0%, rgba(17, 33, 25, 0) 70%);"></div>
<!-- Main Container - Mobile Dimensions -->
<main class="w-full max-w-sm relative z-10 flex flex-col h-[800px] max-h-[90vh] justify-between">
<!-- Header Section -->
<div class="flex flex-col items-center pt-12 animate-fade-in-down">
<!-- Logo Icon -->
<div class="w-16 h-16 rounded-2xl glass-panel flex items-center justify-center mb-6 text-primary">
<span class="material-icons text-4xl">local_shipping</span>
</div>
<h1 class="text-2xl font-light tracking-wide text-white/90">FLEET<span class="font-bold text-primary">OS</span></h1>
<p class="text-xs tracking-[0.2em] text-white/40 mt-2 uppercase">Driver Terminal v2.4</p>
</div>
<!-- Login Form Section -->
<div class="flex-1 flex flex-col justify-center space-y-6 px-2">
<!-- Driver ID Input -->
<div class="group">
<label class="block text-xs font-medium text-primary/80 uppercase tracking-wider mb-2 ml-1">Driver ID</label>
<div class="glass-input rounded-2xl flex items-center px-4 py-4">
<span class="material-icons text-white/40 mr-3 text-xl">badge</span>
<input class="bg-transparent border-none outline-none text-white placeholder-white/30 flex-1 font-light focus:ring-0 p-0 text-lg" placeholder="Enter your ID" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="group">
<label class="block text-xs font-medium text-primary/80 uppercase tracking-wider mb-2 ml-1">Password</label>
<div class="glass-input rounded-2xl flex items-center px-4 py-4">
<span class="material-icons text-white/40 mr-3 text-xl">lock</span>
<input class="bg-transparent border-none outline-none text-white placeholder-white/30 flex-1 font-light focus:ring-0 p-0 text-lg" placeholder="••••••••" type="password"/>
<button class="text-white/40 hover:text-primary transition-colors focus:outline-none">
<span class="material-icons text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Actions Stack -->
<div class="pt-4 space-y-4">
<!-- Primary Sign In Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-semibold rounded-2xl py-4 transition-all transform active:scale-[0.98] shadow-[0_0_20px_rgba(68,233,150,0.3)] flex items-center justify-center gap-2">
<span>Sign In</span>
<span class="material-icons text-lg">arrow_forward</span>
</button>
<!-- Biometric Button (Face ID) -->
<button class="w-full glass-panel hover:bg-white/5 text-white rounded-2xl py-4 transition-all active:scale-[0.98] flex items-center justify-center gap-3 border border-white/10 group">
<div class="relative w-6 h-6 flex items-center justify-center">
<span class="material-icons text-2xl text-primary/80 group-hover:text-primary transition-colors absolute">face</span>
<!-- Scanning animation effect simulation -->
<div class="absolute inset-0 border-t border-primary/60 animate-pulse w-full top-1/2"></div>
</div>
<span class="text-sm font-medium tracking-wide">Login with Face ID</span>
</button>
</div>
</div>
<!-- Footer -->
<div class="pb-8 flex flex-col items-center space-y-4">
<button class="text-sm text-white/40 hover:text-white transition-colors flex items-center gap-1 group">
<span class="material-icons text-base group-hover:text-primary transition-colors">help_outline</span>
<span>Need help logging in?</span>
</button>
<div class="w-12 h-1 rounded-full bg-white/10"></div>
</div>
</main>
<!-- Background Image Overlay for Texture (Optional, keeps it minimal) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCK4sNIWJRmieM6TDL3swUe7RF6UVJMHYFyHFzHJg8Ix8VSVM3HD17bJnM8CNKVsxoVJEjxoJiVqorPzwpEAy199DSkPzM1Y59gmsbLiuuHoDA3rWMkvraJfb_CR-sXbmUc9B0tnIUdiU6rD4x4FhKGMEwoPPxulkzbONmjY8UQEPLJ2klb1-YOHhzo1Eeuk13l3KNFx3zaoinzZ_JkDqncmwLTEfsXcu1qwwKq5Unkheb4yhFLc0ZMDdr4ToJSspQIqVRIVrAfIv0'); background-size: 4px;"></div>
</body></html>
