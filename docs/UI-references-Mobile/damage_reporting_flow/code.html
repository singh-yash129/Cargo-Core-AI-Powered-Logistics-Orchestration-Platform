<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delivery Damage Reporting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f2a60d",
              "background-light": "#f8f7f5",
              "background-dark": "#221c10",
              "surface-dark": "#2d261a", // Slightly lighter than background-dark for cards/inputs
              "surface-light": "#ffffff",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Fade effect for bottom sticky button area */
        .bottom-fade {
            background: linear-gradient(to top, #221c10 20%, rgba(34, 28, 16, 0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 font-display min-h-screen flex flex-col antialiased selection:bg-primary/30">
<!-- Status Bar Area (Mock) -->
<div class="w-full h-12 flex justify-between items-center px-6 text-xs font-medium dark:text-slate-400">
<span>9:41</span>
<div class="flex gap-2 items-center">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm">battery_full</span>
</div>
</div>
<!-- Header -->
<header class="px-5 py-4 flex items-center justify-between sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="p-2 -ml-2 rounded-full hover:bg-slate-200 dark:hover:bg-primary/10 transition-colors text-slate-500 dark:text-slate-400">
<span class="material-icons-round text-2xl">arrow_back</span>
</button>
<h1 class="text-lg font-semibold tracking-tight">Report Issue</h1>
<button class="text-sm font-medium text-slate-500 dark:text-primary hover:text-primary transition-colors">
            Cancel
        </button>
</header>
<!-- Main Content -->
<main class="flex-1 px-5 pb-32 flex flex-col gap-8 overflow-y-auto no-scrollbar">
<!-- Order Context Card -->
<section>
<div class="bg-white dark:bg-surface-dark p-4 rounded-xl border border-slate-200 dark:border-primary/10 shadow-sm flex items-start gap-4">
<div class="h-12 w-12 shrink-0 rounded-lg bg-slate-100 dark:bg-primary/20 flex items-center justify-center text-primary">
<span class="material-icons-round text-2xl">local_shipping</span>
</div>
<div>
<p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-0.5">Order #LG-9482</p>
<h2 class="text-base font-semibold dark:text-white">Applewood Logistics Center</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">45 Industrial Blvd, Sector 4</p>
</div>
</div>
</section>
<!-- Section 1: Severity Selection -->
<section class="flex flex-col gap-3">
<h3 class="text-sm font-semibold text-slate-900 dark:text-slate-200 uppercase tracking-wide opacity-80 pl-1">Damage Level</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Minor Option -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="severity" type="radio" value="minor"/>
<div class="h-full p-5 rounded-xl bg-white dark:bg-surface-dark border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 flex flex-col items-center justify-center gap-3 shadow-sm group-hover:bg-slate-50 dark:group-hover:bg-surface-dark/80">
<div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 peer-checked:bg-primary peer-checked:text-background-dark dark:peer-checked:text-background-dark flex items-center justify-center transition-colors">
<span class="material-icons-round text-xl">info</span>
</div>
<span class="font-medium text-slate-700 dark:text-slate-200 peer-checked:text-primary dark:peer-checked:text-primary transition-colors">Minor</span>
</div>
<!-- Checkmark Badge -->
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-icons-round text-lg">check_circle</span>
</div>
</label>
<!-- Major Option -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="severity" type="radio" value="major"/>
<div class="h-full p-5 rounded-xl bg-white dark:bg-surface-dark border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 flex flex-col items-center justify-center gap-3 shadow-sm group-hover:bg-slate-50 dark:group-hover:bg-surface-dark/80">
<div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 peer-checked:bg-primary peer-checked:text-background-dark dark:peer-checked:text-background-dark flex items-center justify-center transition-colors">
<span class="material-icons-round text-xl">warning</span>
</div>
<span class="font-medium text-slate-700 dark:text-slate-200 peer-checked:text-primary dark:peer-checked:text-primary transition-colors">Major</span>
</div>
<!-- Checkmark Badge -->
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-icons-round text-lg">check_circle</span>
</div>
</label>
</div>
</section>
<!-- Section 2: Photo Evidence -->
<section class="flex flex-col gap-3">
<div class="flex justify-between items-end pl-1">
<h3 class="text-sm font-semibold text-slate-900 dark:text-slate-200 uppercase tracking-wide opacity-80">Photo Evidence</h3>
<span class="text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-full font-medium">Required</span>
</div>
<div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar -mx-5 px-5 snap-x">
<!-- Upload Button -->
<button class="snap-start shrink-0 w-32 h-32 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 hover:border-primary dark:hover:border-primary bg-slate-50 dark:bg-surface-dark/50 flex flex-col items-center justify-center gap-2 text-slate-400 hover:text-primary dark:hover:text-primary transition-colors group">
<div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 group-hover:bg-primary/20 flex items-center justify-center transition-colors">
<span class="material-icons-round text-xl dark:text-slate-300 group-hover:text-primary">add_a_photo</span>
</div>
<span class="text-xs font-medium">Add Photo</span>
</button>
<!-- Thumbnail 1 -->
<div class="snap-start shrink-0 w-32 h-32 rounded-xl bg-slate-800 relative group overflow-hidden border border-slate-200 dark:border-slate-700">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="Close up of a damaged cardboard box corner" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBajt1xw0_NgPCQo2fTeFHyNnmfZYU9w8-3qvfAbOL0jucLLQscGz2Bk_r5w6748AHs_JXhhVLYbuIDe3pRcsugDbvhTfLy-jAvQObxxi2w1p_X_0DqmbzyETBrC2H35jHLi9K9U3q2U84a4ZYyb9Qh1EVccvZj_NcmPUrcssqvi7TAbwpDbRyfkpfXjHl2HepKglqOIXCgGc8OUagZ-0UmbqOYtrSjnyUtufmcLksdAVNTYZl854nI1DSB9g2_DwxcTWU20KPz9K0"/>
<button class="absolute top-1 right-1 bg-black/50 hover:bg-red-500 text-white p-1 rounded-full backdrop-blur-sm transition-colors">
<span class="material-icons-round text-sm block">close</span>
</button>
<div class="absolute bottom-0 left-0 right-0 p-1.5 bg-gradient-to-t from-black/80 to-transparent">
<p class="text-[10px] text-white font-medium text-center">Corner damage</p>
</div>
</div>
<!-- Thumbnail 2 -->
<div class="snap-start shrink-0 w-32 h-32 rounded-xl bg-slate-800 relative group overflow-hidden border border-slate-200 dark:border-slate-700">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="Side view of a slightly crushed package" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYeiNdSRQtuH_ZjcyRQl5huAhaWFLNBVtTPKTBNYzCsn4ViYN7L_1nHnsB52v0x_gQjyI4KDqsjZDgDUmB7Z_Z2X30l2BNF7YUbLcTCZA1X_DhpZOGW6aF1D0gb1bKvaRb9jX6MTFMNkPVeAq70ZRbDTfT2sdMx1CJ4lHGtuu21XC4xC5WR67YsITPNWB_xsDxtUc6NdzVY75yPu-iLHdjEOUYC9xdU3UxnKMparjkIx1oPxVYdQ9K4ndQkGbwYj1IhIWeTn_TcVU"/>
<button class="absolute top-1 right-1 bg-black/50 hover:bg-red-500 text-white p-1 rounded-full backdrop-blur-sm transition-colors">
<span class="material-icons-round text-sm block">close</span>
</button>
</div>
</div>
</section>
<!-- Section 3: Description -->
<section class="flex flex-col gap-3">
<h3 class="text-sm font-semibold text-slate-900 dark:text-slate-200 uppercase tracking-wide opacity-80 pl-1">Description</h3>
<div class="relative">
<textarea class="w-full min-h-[140px] rounded-xl bg-white dark:bg-surface-dark border border-slate-200 dark:border-primary/10 text-slate-800 dark:text-slate-100 p-4 focus:ring-2 focus:ring-primary focus:border-transparent placeholder-slate-400 dark:placeholder-slate-500 resize-none transition-shadow" placeholder="Describe the damage details here. Is the contents exposed? Was it damaged upon arrival?"></textarea>
<div class="absolute bottom-3 right-3 text-xs text-slate-400 font-medium bg-white dark:bg-surface-dark px-1">
                    45/300
                </div>
</div>
</section>
</main>
<!-- Sticky Footer Action -->
<footer class="fixed bottom-0 left-0 w-full p-5 pt-8 z-20 bottom-fade">
<button class="w-full bg-primary hover:bg-yellow-500 active:scale-[0.98] transition-all duration-200 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group">
<span>Submit Damage Report</span>
<span class="material-icons-round group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</footer>
</body></html>
