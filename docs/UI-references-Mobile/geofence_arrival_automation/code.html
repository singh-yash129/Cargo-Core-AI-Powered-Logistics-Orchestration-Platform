<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Geofence Arrival Automation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44e996",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112119", // Dark green-tinted black for theme consistency
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        /* Custom map styles simulation */
        .map-bg {
            background-color: #1a1d1c;
            background-image: 
                radial-gradient(#44e996 1px, transparent 1px), 
                radial-gradient(#2d3330 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        
        /* Map roads simulation */
        .road {
            position: absolute;
            background: #2d3330;
            border-radius: 999px;
        }
        
        .road-highlight {
            position: absolute;
            background: #44e996;
            opacity: 0.3;
            border-radius: 999px;
            box-shadow: 0 0 15px #44e996;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white h-screen w-full overflow-hidden relative selection:bg-primary selection:text-black">
<!-- Top Status Bar Area (iOS Safe Area Mock) -->
<div class="absolute top-0 w-full z-50 flex justify-between items-center px-6 pt-5 pb-2 bg-gradient-to-b from-black/60 to-transparent pointer-events-none">
<span class="text-xs font-semibold tracking-wide">9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm">battery_full</span>
</div>
</div>
<!-- Map Background Layer -->
<div class="absolute inset-0 z-0 map-bg w-full h-full">
<!-- Abstract Roads for visual context -->
<div class="road w-[800px] h-4 top-1/3 -left-20 rotate-12"></div>
<div class="road w-4 h-[800px] top-[-100px] left-1/3 rotate-12"></div>
<div class="road w-[600px] h-3 top-2/3 -right-20 -rotate-6"></div>
<!-- Driver Route Path -->
<div class="road-highlight w-[400px] h-2 top-[34%] -left-10 rotate-12"></div>
<div class="road-highlight w-2 h-[200px] top-[14%] left-[34.5%] rotate-12 origin-bottom"></div>
<!-- Geofence Zone Indicator -->
<div class="absolute top-[28%] left-[55%] w-64 h-64 -translate-x-1/2 -translate-y-1/2 rounded-full border border-primary/30 bg-primary/5 animate-pulse-slow flex items-center justify-center">
<div class="w-48 h-48 rounded-full border border-primary/50 bg-primary/10 flex items-center justify-center">
<!-- Destination Marker -->
<div class="relative">
<div class="w-4 h-4 bg-primary rounded-full shadow-[0_0_15px_rgba(68,233,150,0.8)] z-10 relative"></div>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-8 h-8 bg-primary/30 rounded-full animate-ping"></div>
</div>
</div>
</div>
<!-- Floating Map Controls (Top Right) -->
<div class="absolute top-16 right-4 flex flex-col gap-3 z-10">
<button class="w-10 h-10 bg-gray-900/90 backdrop-blur-md rounded-full flex items-center justify-center border border-gray-700 shadow-lg active:scale-95 transition-transform">
<span class="material-icons-round text-white text-lg">layers</span>
</button>
<button class="w-10 h-10 bg-gray-900/90 backdrop-blur-md rounded-full flex items-center justify-center border border-gray-700 shadow-lg active:scale-95 transition-transform">
<span class="material-icons-round text-primary text-lg">my_location</span>
</button>
</div>
</div>
<!-- Main Content: Auto-Arrival Card (Bottom Sheet) -->
<div class="absolute bottom-0 left-0 w-full z-20 flex flex-col items-center justify-end h-full pointer-events-none">
<!-- Scrim Gradient for readability -->
<div class="absolute bottom-0 w-full h-3/4 bg-gradient-to-t from-black via-black/80 to-transparent pointer-events-none"></div>
<!-- The Card -->
<div class="w-full bg-[#1c1c1e] dark:bg-[#1c1c1e] rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] border-t border-white/10 pointer-events-auto transform translate-y-0 animate-slide-up pb-8">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-gray-600 rounded-full"></div>
</div>
<!-- Header Content -->
<div class="px-6 pt-4">
<div class="flex items-center gap-2 mb-4">
<div class="px-2.5 py-1 rounded bg-primary/20 border border-primary/30 text-primary text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                        Auto-Arrival Detected
                    </div>
<span class="text-gray-400 text-xs">10:42 AM</span>
</div>
<div class="flex items-start justify-between mb-6">
<div>
<h1 class="text-3xl font-display font-bold text-white mb-1 leading-tight">
                            Arrived at <span class="text-primary">Stop #4</span>
</h1>
<p class="text-gray-400 text-lg font-medium">Target Store 2894</p>
</div>
<!-- Status Icon -->
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shadow-[0_0_20px_rgba(68,233,150,0.4)]">
<span class="material-icons-round text-black text-3xl font-bold">check</span>
</div>
</div>
<!-- Location Details Mini-Card -->
<div class="bg-white/5 rounded-xl p-4 mb-6 border border-white/5 flex gap-4 items-center">
<div class="w-12 h-12 rounded bg-gray-700 overflow-hidden shrink-0 relative">
<!-- Placeholder for location image -->
<div class="w-full h-full bg-gradient-to-br from-gray-600 to-gray-800 flex items-center justify-center" data-alt="Abstract store front thumbnail gradient">
<span class="material-icons-round text-white/20">storefront</span>
</div>
</div>
<div class="flex-1 min-w-0">
<p class="text-white font-medium truncate">123 Main St, Seattle, WA</p>
<p class="text-gray-400 text-sm truncate">Loading Dock B • Door code: 4590</p>
</div>
<button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shrink-0">
<span class="material-icons-round text-white text-sm">arrow_forward</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-green-400 active:scale-[0.98] transition-all rounded-xl py-4 flex items-center justify-center gap-3 shadow-[0_4px_20px_rgba(68,233,150,0.25)] mb-4 group">
<span class="material-icons-round text-black text-2xl group-hover:translate-x-1 transition-transform">inventory_2</span>
<span class="text-black font-bold text-lg">Start Delivery Task</span>
</button>
<!-- Secondary Actions Grid -->
<div class="grid grid-cols-2 gap-4 mb-6">
<button class="bg-[#2c2c2e] hover:bg-[#3a3a3c] active:bg-[#2c2c2e] transition-colors rounded-xl py-3.5 px-4 flex flex-col items-center justify-center gap-1 border border-white/5">
<span class="material-icons-round text-primary text-xl">call</span>
<span class="text-white font-medium text-sm">Call Customer</span>
</button>
<button class="bg-[#2c2c2e] hover:bg-[#3a3a3c] active:bg-[#2c2c2e] transition-colors rounded-xl py-3.5 px-4 flex flex-col items-center justify-center gap-1 border border-white/5">
<span class="material-icons-round text-red-400 text-xl">report_problem</span>
<span class="text-white font-medium text-sm">Report Issue</span>
</button>
</div>
<!-- Undo Action -->
<div class="w-full flex justify-center">
<button class="text-gray-500 text-sm font-medium hover:text-white transition-colors flex items-center gap-1 py-2 px-4 rounded-lg active:bg-white/5">
                        Not actually here? <span class="underline decoration-gray-600 underline-offset-2">Cancel Arrival</span>
</button>
</div>
</div>
<!-- Safe Area Spacer for Home Indicator -->
<div class="h-6"></div>
</div>
</div>
<!-- Toast Notification (Example of something that might pop up) -->
<div class="absolute top-16 left-4 right-4 z-40 transform -translate-y-24 transition-transform duration-500 ease-out" id="notification-toast">
<div class="bg-gray-900/90 backdrop-blur-md border border-gray-700 rounded-lg p-3 shadow-xl flex items-center gap-3">
<span class="material-icons-round text-primary">info</span>
<span class="text-sm text-white font-medium">Next stop is 12 mins away</span>
</div>
</div>
</body></html>
