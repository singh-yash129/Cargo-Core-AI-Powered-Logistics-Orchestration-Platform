apply plugin: 'com.android.application'

android {
    namespace "com.cargocoredriver.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cargocoredriver.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def adbExecutablePath() {
    def sdkDir = android.sdkDirectory
    def adbName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'adb.exe' : 'adb'
    return new File(sdkDir, "platform-tools/${adbName}")
}

tasks.register('setupUsbDebugReverse') {
    group = 'device setup'
    description = 'Configures adb reverse for the local backend during USB debug runs.'

    doLast {
        def adb = adbExecutablePath()
        if (!adb.exists()) {
            logger.lifecycle("Skipping adb reverse: ${adb.absolutePath} not found")
            return
        }

        def devicesOutput = new ByteArrayOutputStream()
        exec {
            commandLine adb.absolutePath, 'devices'
            standardOutput = devicesOutput
            errorOutput = devicesOutput
            ignoreExitValue true
        }

        def connectedDevices = devicesOutput
            .toString('UTF-8')
            .readLines()
            .findAll { it ==~ /.+\s+device$/ }

        if (connectedDevices.isEmpty()) {
            logger.lifecycle('Skipping adb reverse: no authorized USB debug device detected')
            return
        }

        def reverseOutput = new ByteArrayOutputStream()
        exec {
            commandLine adb.absolutePath, '-d', 'reverse', 'tcp:8000', 'tcp:8000'
            standardOutput = reverseOutput
            errorOutput = reverseOutput
            ignoreExitValue true
        }

        def reverseResult = reverseOutput.toString('UTF-8').trim()
        if (reverseResult) {
            logger.lifecycle("adb reverse result: ${reverseResult}")
        } else {
            logger.lifecycle('adb reverse tcp:8000 -> tcp:8000 configured for USB debugging')
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // CameraX — required by MainApplication.java (CameraXConfig.Provider + Camera2Config)
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
}

apply from: 'capacitor.build.gradle'

tasks.matching { it.name == 'preDebugBuild' }.configureEach {
    dependsOn tasks.named('setupUsbDebugReverse')
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
